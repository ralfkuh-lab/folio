[package]
name = "folio"
version = "0.7.1"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["Ralf Kuhlendahl"]
repository = "https://github.com/ralfkuh-lab/folio"

[dependencies]
# Phase 1: Markdown-Pipeline
comrak = { version = "0.35", default-features = false, features = ["shortcodes"] }
# comrak 0.35 koppelt sein optionales `syntect`-Feature auf nativen Targets
# fest an `regex-onig`. Deshalb nutzen wir dessen oeffentlichen
# SyntaxHighlighterAdapter-Slot mit syntect direkt. `default-fancy` liefert
# Default-Syntaxen/-Themes und HTML-Ausgabe ueber das pure-Rust-Backend
# fancy-regex, ohne Oniguruma/C-Toolchain.
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
regex = "1.11"
# YAML 1.2 fuer Frontmatter-Anzeige. Wird ausschliesslich im Display-Pfad
# benutzt; die Delimiter-Detektion bleibt eigen, damit ein Parse-Fehler
# nie den Body verschluckt (saphyr-Fehler -> Roh-Block-Fallback).
saphyr = "0.0.6"

# Phase 2-3: Serde + Persistenz
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
serde_json = "1.0"
tempfile = "3.14"
dirs = "6.0"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

# Phase 5: File-Watching + Automation-API
notify = "7.0"
axum = "0.8"
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
# Explizite models.dev-/Provider-HTTP-Aufrufe. Dieselbe reqwest-Major-
# Version zieht Tauri bereits ein; rustls vermeidet eine weitere native
# TLS-Abhaengigkeit fuer folio-eigene Requests.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
futures-util = "0.3"
thiserror = "2"

# Phase 4: Tauri
tauri = { version = "2", features = ["protocol-asset", "test"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
# Screenshot via Plugin (Monitor-Framebuffer). Notwendig fuer Monaco
# in Xvfb/Headless — siehe docs/headless-monaco-test-results.md.
tauri-plugin-screenshots = "2.2.0"
# Clipboard-Manager fuer Image-Insert-Feature (Strg+V im Editor + Toolbar
# image-Button). Cross-platform Win/macOS/Linux.
tauri-plugin-clipboard-manager = "2"

# Pfad-Konvertierung absolut → relativ-zu-Dokument, fuers Bild-Insert.
pathdiff = "0.2"

# Gitignore-Matching für Vault-Dimming (nur GitignoreBuilder, kein Walk).
# Wird in git_ignore.rs verwendet (ignore-Crate von ripgrep).
ignore = "0.4"

# Zeichenkodierung fuer Nicht-UTF-8-Dateien (Windows-1252-Fallback + UTF-16-
# Decode) in document_store.rs. UTF-16-*Encode* laeuft bewusst ueber std
# (str::encode_utf16), weil encoding_rs keinen UTF-16-Encoder hat.
encoding_rs = "0.8"

# Papierkorb-Löschen fürs Vault-Kontextmenü (wiederherstellbar statt hart).
trash = "5"

# File-type icons + Image-Insert (Clipboard-RGBA → PNG, File-Picker auch
# fuer jpg/gif/webp).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
base64 = "0.22"

# Strukturiertes Logging. `tracing` als Macros, `tracing-subscriber` mit
# `env-filter` fuer RUST_LOG-Overrides, `tracing-appender` fuer das
# Rolling-File-Sink im OS-Log-Verzeichnis. Live-Reload des Filters per
# `tracing-subscriber::reload` ist eingebaut.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# OS-Locale für i18n-Default (system → BCP-47).
sys-locale = "0.3"

# `O_NONBLOCK` fuer den Open-Pfad der Hex-Commands: nur so blockiert ein
# FIFO das `open` nicht, wenn er zwischen `stat` und `open` untergeschoben
# wird (siehe commands::file::chunk::open_regular_file).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
freedesktop-icons = "0.2"
xdg-mime = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSImage", "NSBitmapImageRep", "NSGraphicsContext"] }
objc2-foundation = { version = "0.3", features = ["NSDictionary", "NSString", "NSGeometry"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tower = "0.5"

[lib]
# Library-Name absichtlich != Binary-Name `folio`: sonst kollidieren
# folio.pdb (bin) und folio.pdb (lib) im Target-Verzeichnis, was Cargo
# als hard error vorbereitet (rust-lang/cargo#6313). Tests + main.rs
# importieren entsprechend via `use folio_lib::...`.
name = "folio_lib"
path = "src/lib.rs"

crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "folio"
path = "src/main.rs"
