<div style="display: flex; flex-direction: column; justify-content: space-between; height: 100%; min-height: 250mm; padding: 20mm; font-family: 'Inter', sans-serif; box-sizing: border-box;">
  <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
    <div style="font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: #64748b;">
      {{company}}
    </div>
    <div style="max-height: 40px; max-width: 120px;">
      {{logo}}
    </div>
  </div>
  
  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; margin-top: 50mm; margin-bottom: 50mm;">
    <h1 style="font-size: 38px; font-weight: 800; line-height: 1.2; color: #0f172a; margin: 0 0 20px; border-bottom: 4px solid #2563eb; padding-bottom: 20px; font-family: 'Inter', sans-serif;">
      {{title}}
    </h1>
    <p style="font-size: 18px; font-weight: 400; color: #475569; margin: 0; line-height: 1.5; font-family: 'Inter', sans-serif;">
      {{subtitle}}
    </p>
  </div>
  
  <div style="display: flex; justify-content: space-between; align-items: flex-end; width: 100%; border-top: 1px solid #e2e8f0; padding-top: 20px; font-size: 12px; color: #64748b; font-family: 'Inter', sans-serif;">
    <div>
      <span style="display: block; font-weight: 600; color: #1e293b; margin-bottom: 4px;">Vorbereitet von:</span>
      <span>{{author}}</span>
    </div>
    <div>
      <span>{{date}}</span>
    </div>
  </div>
</div>
